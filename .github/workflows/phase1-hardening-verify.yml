name: Phase 1 Hardening Verify

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sesame-group-phase1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests and assemble
        run: |
          chmod +x gradlew
          ./gradlew :sesame-sdk:testDebugUnitTest :app:testDebugUnitTest :sesame-sdk:assembleDebug :app:assembleDebug --stacktrace
      - name: Target lint
        shell: bash
        run: |
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          echo "target_lint_exit=$?" | tee /tmp/target-lint-exit.txt
          set -e
          cp app/build/reports/lint-results-debug.txt /tmp/target-app-lint.txt 2>/dev/null || : > /tmp/target-app-lint.txt
          cp sesame-sdk/build/reports/lint-results-debug.txt /tmp/target-sdk-lint.txt 2>/dev/null || : > /tmp/target-sdk-lint.txt
      - name: Master lint
        shell: bash
        run: |
          git clean -fdx
          git checkout --detach 817cd8d954a6c5e08ed505d9d5775e649a31694e
          chmod +x gradlew
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          echo "master_lint_exit=$?" | tee /tmp/master-lint-exit.txt
          set -e
          cp app/build/reports/lint-results-debug.txt /tmp/master-app-lint.txt 2>/dev/null || : > /tmp/master-app-lint.txt
          cp sesame-sdk/build/reports/lint-results-debug.txt /tmp/master-sdk-lint.txt 2>/dev/null || : > /tmp/master-sdk-lint.txt
      - name: Compare lint
        shell: bash
        run: |
          for side in target master; do
            echo "$side app errors=$(grep -c ' Error:' /tmp/$side-app-lint.txt || true) warnings=$(grep -c ' Warning:' /tmp/$side-app-lint.txt || true)"
            echo "$side sdk errors=$(grep -c ' Error:' /tmp/$side-sdk-lint.txt || true) warnings=$(grep -c ' Warning:' /tmp/$side-sdk-lint.txt || true)"
          done

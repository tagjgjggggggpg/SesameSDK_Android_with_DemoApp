name: Phase 2 Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sesame-group-phase2

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Phase 2 and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :sesame-sdk:testDebugUnitTest :app:testDebugUnitTest :sesame-sdk:assembleDebug :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sesame-phase2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

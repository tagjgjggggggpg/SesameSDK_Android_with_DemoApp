name: Phase 1 Verify

on:
  push:
    branches:
      - codex/sesame-group-phase1

jobs:
  lint-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run lint without hiding existing failures
        shell: bash
        run: |
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          status=$?
          echo "lint_exit_code=$status"
          echo "--- app lint errors ---"
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            grep -n "Error:" "$report" || true
          else
            echo "app lint text report not found"
          fi
          echo "--- sdk lint errors ---"
          sdk_report="sesame-sdk/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$sdk_report" ]; then
            grep -n "Error:" "$sdk_report" || true
          else
            echo "sdk lint text report not found"
          fi
          exit 0

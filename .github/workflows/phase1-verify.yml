name: Phase 1 Verify

on:
  push:
    branches:
      - codex/sesame-group-phase1

jobs:
  master-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout master
        run: git checkout --detach origin/master

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Master lint inventory
        shell: bash
        run: |
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          status=$?
          echo "lint_exit_code=$status"
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          sdk_report="sesame-sdk/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          echo "--- master app lint errors ---"
          [ -f "$report" ] && grep -n "Error:" "$report" || true
          echo "--- master sdk lint errors ---"
          [ -f "$sdk_report" ] && grep -n "Error:" "$sdk_report" || true
          exit 0

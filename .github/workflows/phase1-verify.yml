name: Phase 1 Verify

on:
  push:
    branches:
      - codex/sesame-group-phase1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :sesame-sdk:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Debug compile
        run: ./gradlew :sesame-sdk:assembleDebug :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace

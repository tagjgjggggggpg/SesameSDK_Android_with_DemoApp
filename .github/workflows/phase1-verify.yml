name: Phase 1 Verify

on:
  push:
    branches:
      - codex/sesame-group-phase1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :sesame-sdk:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :sesame-sdk:assembleDebug :app:assembleDebug --stacktrace

      - name: Lint inventory
        shell: bash
        run: |
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          status=$?
          echo "lint_exit_code=$status"
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          sdk_report="sesame-sdk/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          echo "--- app lint errors ---"
          [ -f "$report" ] && grep -n "Error:" "$report" || true
          echo "--- sdk lint errors ---"
          [ -f "$sdk_report" ] && grep -n "Error:" "$sdk_report" || true
          echo "--- Phase 1 app warnings ---"
          if [ -f "$report" ]; then
            grep -nE '(lockgroup/|DeviceListFG\.kt|fg_devicelist\.xml|AndroidManifest\.xml).*Warning:' "$report" || true
          fi
          echo "--- Phase 1 sdk warnings ---"
          if [ -f "$sdk_report" ]; then
            grep -nE '(CHSesame5Device\.kt|StrictSesame5CommandExecutor\.kt|CHSesame5\.kt).*Warning:' "$sdk_report" || true
          fi
          exit 0

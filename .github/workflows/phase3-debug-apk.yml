name: Phase 3 Phone and Wear Debug APKs

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sesame-group-phase3

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Phase 3 debug signing key
        shell: bash
        env:
          PHASE3_DEBUG_KEYSTORE_B64: ${{ secrets.PHASE3_DEBUG_KEYSTORE_B64 }}
          PHASE3_DEBUG_STORE_PASSWORD: ${{ secrets.PHASE3_DEBUG_STORE_PASSWORD }}
          PHASE3_DEBUG_KEY_ALIAS: ${{ secrets.PHASE3_DEBUG_KEY_ALIAS }}
          PHASE3_DEBUG_KEY_PASSWORD: ${{ secrets.PHASE3_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            PHASE3_DEBUG_KEYSTORE_B64 \
            PHASE3_DEBUG_STORE_PASSWORD \
            PHASE3_DEBUG_KEY_ALIAS \
            PHASE3_DEBUG_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          umask 077
          if ! printf '%s' "$PHASE3_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/phase3-debug.jks"; then
            echo "::error::PHASE3_DEBUG_KEYSTORE_B64 is not valid base64"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/phase3-debug.jks" ]; then
            echo "::error::Decoded Phase 3 keystore is empty"
            exit 1
          fi
          echo "Phase 3 debug keystore restored"

      - name: Test and build Phase 3 phone and Wear APKs
        env:
          PHASE3_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/phase3-debug.jks
          PHASE3_DEBUG_STORE_PASSWORD: ${{ secrets.PHASE3_DEBUG_STORE_PASSWORD }}
          PHASE3_DEBUG_KEY_ALIAS: ${{ secrets.PHASE3_DEBUG_KEY_ALIAS }}
          PHASE3_DEBUG_KEY_PASSWORD: ${{ secrets.PHASE3_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :sesame-sdk:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest :sesame-sdk:assembleDebug :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Verify Wear Tile provider merged manifest
        shell: bash
        run: |
          set -euo pipefail
          WEAR_MANIFEST="$(find wear/build/intermediates -type f -name AndroidManifest.xml -path '*merged_manifest*debug*' | head -n 1)"
          if [ -z "$WEAR_MANIFEST" ] || [ ! -f "$WEAR_MANIFEST" ]; then
            echo "::error::Merged Wear debug manifest not found"
            exit 1
          fi
          python3 - "$WEAR_MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse(sys.argv[1]).getroot()
          application = manifest.find("application")
          if application is None:
              raise SystemExit("ASSERTION_FAILED=wear_application_manifest")
          services = application.findall("service")
          service = next((s for s in services if (s.get(android + "name") or "").endswith(".EntranceTileService")), None)
          if service is None:
              raise SystemExit("ASSERTION_FAILED=entrance_tile_service_present")
          print("ASSERTION_PASSED=entrance_tile_service_present")
          if service.get(android + "permission") != "com.google.android.wearable.permission.BIND_TILE_PROVIDER":
              raise SystemExit("ASSERTION_FAILED=tile_bind_permission")
          print("ASSERTION_PASSED=tile_bind_permission")
          actions = [a.get(android + "name") for f in service.findall("intent-filter") for a in f.findall("action")]
          if "androidx.wear.tiles.action.BIND_TILE_PROVIDER" not in actions:
              raise SystemExit("ASSERTION_FAILED=tile_bind_action")
          print("ASSERTION_PASSED=tile_bind_action")
          if not service.get(android + "icon"):
              raise SystemExit("ASSERTION_FAILED=tile_icon")
          print("ASSERTION_PASSED=tile_icon")
          if not service.get(android + "description"):
              raise SystemExit("ASSERTION_FAILED=tile_description")
          print("ASSERTION_PASSED=tile_description")
          preview = next((m for m in service.findall("meta-data") if m.get(android + "name") == "androidx.wear.tiles.PREVIEW"), None)
          if preview is None or not preview.get(android + "resource"):
              raise SystemExit("ASSERTION_FAILED=tile_preview")
          print("ASSERTION_PASSED=tile_preview")
          print(f"WEAR_MERGED_MANIFEST={sys.argv[1]}")
          PY

      - name: Verify application IDs and Phase 3 signer certificate
        shell: bash
        run: |
          set -euo pipefail
          PHONE_APK="app/build/outputs/apk/debug/app-debug.apk"
          WEAR_APK="wear/build/outputs/apk/debug/wear-debug.apk"
          EXPECTED_ID="co.candyhouse.sesame2.phase2debug"
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          assert_eq() {
            local name="$1" actual="$2" expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "ASSERTION_FAILED=$name"
              exit 1
            fi
            echo "ASSERTION_PASSED=$name"
          }
          extract_signer_sha256() {
            local apk="$1"
            local output cert
            if ! output="$($APKSIGNER verify --print-certs "$apk" 2>&1)"; then
              return 1
            fi
            cert="$(printf '%s\n' "$output" | awk '
              BEGIN { IGNORECASE=1 }
              /certificate/ && /SHA/ && /256/ && /digest:/ {
                line=$0
                sub(/^.*digest:[[:space:]]*/, "", line)
                gsub(/[^0-9A-Fa-f]/, "", line)
                print tolower(line)
                exit
              }
            ')"
            printf '%s' "$cert"
          }
          if [ ! -f "$PHONE_APK" ]; then echo "ASSERTION_FAILED=phone_apk_present"; exit 1; fi
          if [ ! -f "$WEAR_APK" ]; then echo "ASSERTION_FAILED=wear_apk_present"; exit 1; fi
          if [ ! -x "$APKANALYZER" ]; then echo "ASSERTION_FAILED=apkanalyzer_available"; exit 1; fi
          if [ ! -x "$APKSIGNER" ]; then echo "ASSERTION_FAILED=apksigner_available"; exit 1; fi
          PHONE_ID="$($APKANALYZER manifest application-id "$PHONE_APK")"
          WEAR_ID="$($APKANALYZER manifest application-id "$WEAR_APK")"
          PHONE_CERT="$(extract_signer_sha256 "$PHONE_APK")"
          WEAR_CERT="$(extract_signer_sha256 "$WEAR_APK")"
          echo "PHONE_ID=$PHONE_ID"
          echo "WEAR_ID=$WEAR_ID"
          echo "PHONE_SIGNER_SHA256=$PHONE_CERT"
          echo "WEAR_SIGNER_SHA256=$WEAR_CERT"
          assert_eq phone_application_id "$PHONE_ID" "$EXPECTED_ID"
          assert_eq wear_application_id "$WEAR_ID" "$EXPECTED_ID"
          if [ -z "$PHONE_CERT" ]; then echo "ASSERTION_FAILED=phone_signer_present"; exit 1; fi
          echo "ASSERTION_PASSED=phone_signer_present"
          if [ -z "$WEAR_CERT" ]; then echo "ASSERTION_FAILED=wear_signer_present"; exit 1; fi
          echo "ASSERTION_PASSED=wear_signer_present"
          assert_eq phone_wear_signer_match "$PHONE_CERT" "$WEAR_CERT"
          mkdir -p phase3-artifacts
          cp "$PHONE_APK" phase3-artifacts/phone-debug.apk
          cp "$WEAR_APK" phase3-artifacts/wear-debug.apk
          {
            echo "head_sha=$GITHUB_SHA"
            echo "phone_application_id=$PHONE_ID"
            echo "wear_application_id=$WEAR_ID"
            echo "phone_signer_certificate_sha256=$PHONE_CERT"
            echo "wear_signer_certificate_sha256=$WEAR_CERT"
            sha256sum phase3-artifacts/phone-debug.apk
            sha256sum phase3-artifacts/wear-debug.apk
          } | tee phase3-artifacts/verification.txt

      - name: Upload Phase 3 debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: sesame-phase3-debug-apks
          path: phase3-artifacts/*
          if-no-files-found: error
          retention-days: 14

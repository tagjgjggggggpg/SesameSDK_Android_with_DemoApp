name: Phase 1 Fix Verify

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sesame-group-phase1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :sesame-sdk:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :sesame-sdk:assembleDebug :app:assembleDebug --stacktrace

      - name: Target lint inventory
        id: target_lint
        shell: bash
        run: |
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cp app/build/reports/lint-results-debug.txt /tmp/target-app-lint.txt 2>/dev/null || : > /tmp/target-app-lint.txt
          cp sesame-sdk/build/reports/lint-results-debug.txt /tmp/target-sdk-lint.txt 2>/dev/null || : > /tmp/target-sdk-lint.txt
          echo "target_lint_exit=$status"

      - name: Master lint inventory
        id: master_lint
        shell: bash
        run: |
          git clean -fdx
          git checkout --detach 817cd8d954a6c5e08ed505d9d5775e649a31694e
          chmod +x gradlew
          set +e
          ./gradlew :sesame-sdk:lintDebug :app:lintDebug --stacktrace
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cp app/build/reports/lint-results-debug.txt /tmp/master-app-lint.txt 2>/dev/null || : > /tmp/master-app-lint.txt
          cp sesame-sdk/build/reports/lint-results-debug.txt /tmp/master-sdk-lint.txt 2>/dev/null || : > /tmp/master-sdk-lint.txt
          echo "master_lint_exit=$status"

      - name: Compare lint with master
        shell: bash
        run: |
          count_kind() {
            local pattern="$1"
            local file="$2"
            grep -c "$pattern" "$file" 2>/dev/null || true
          }
          target_app_errors=$(count_kind ' Error:' /tmp/target-app-lint.txt)
          target_sdk_errors=$(count_kind ' Error:' /tmp/target-sdk-lint.txt)
          master_app_errors=$(count_kind ' Error:' /tmp/master-app-lint.txt)
          master_sdk_errors=$(count_kind ' Error:' /tmp/master-sdk-lint.txt)
          target_app_warnings=$(count_kind ' Warning:' /tmp/target-app-lint.txt)
          target_sdk_warnings=$(count_kind ' Warning:' /tmp/target-sdk-lint.txt)
          master_app_warnings=$(count_kind ' Warning:' /tmp/master-app-lint.txt)
          master_sdk_warnings=$(count_kind ' Warning:' /tmp/master-sdk-lint.txt)
          {
            echo "target_lint_exit=${{ steps.target_lint.outputs.status }}"
            echo "master_lint_exit=${{ steps.master_lint.outputs.status }}"
            echo "target_app_errors=$target_app_errors"
            echo "master_app_errors=$master_app_errors"
            echo "target_sdk_errors=$target_sdk_errors"
            echo "master_sdk_errors=$master_sdk_errors"
            echo "target_app_warnings=$target_app_warnings"
            echo "master_app_warnings=$master_app_warnings"
            echo "target_sdk_warnings=$target_sdk_warnings"
            echo "master_sdk_warnings=$master_sdk_warnings"
          } | tee /tmp/lint-summary.txt
          if [ "$target_app_errors" -gt "$master_app_errors" ] || [ "$target_sdk_errors" -gt "$master_sdk_errors" ]; then
            echo "Target introduces additional lint errors compared with master"
            exit 1
          fi

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-lint-evidence
          path: |
            /tmp/lint-summary.txt
            /tmp/target-app-lint.txt
            /tmp/target-sdk-lint.txt
            /tmp/master-app-lint.txt
            /tmp/master-sdk-lint.txt

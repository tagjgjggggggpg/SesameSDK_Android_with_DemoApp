plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics.gradle)
}

def phase3DebugKeystorePath = System.getenv("PHASE3_DEBUG_KEYSTORE_PATH")
def phase3DebugStorePassword = System.getenv("PHASE3_DEBUG_STORE_PASSWORD")
def phase3DebugKeyAlias = System.getenv("PHASE3_DEBUG_KEY_ALIAS")
def phase3DebugKeyPassword = System.getenv("PHASE3_DEBUG_KEY_PASSWORD")
def phase3DebugSigningConfigured = [
        phase3DebugKeystorePath,
        phase3DebugStorePassword,
        phase3DebugKeyAlias,
        phase3DebugKeyPassword,
].every { it != null && !it.isEmpty() }
def phase3DebugRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("debug") }
if (phase3DebugRequested && !phase3DebugSigningConfigured) {
    throw new GradleException("Phase 3 debug signing environment is incomplete")
}

android {
    namespace 'co.candyhouse.app'
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        phase3Debug {
            if (phase3DebugSigningConfigured) {
                storeFile file(phase3DebugKeystorePath)
                storePassword phase3DebugStorePassword
                keyAlias phase3DebugKeyAlias
                keyPassword phase3DebugKeyPassword
            }
        }
        release {
            def passStore = System.getenv("storePassword")
            def passKey = System.getenv("keyPassword")
            def ssmKeyAlias = System.getenv("keyAlias")
            storeFile file('keystore/Sesame.jks')
            storePassword "$passStore"
            keyPassword "$passKey"
            keyAlias "$ssmKeyAlias"

            // 处理 CI 环境中的签名文件
            if (System.getenv("CI") == "true") {
                println("CI signing...")
                // CI 环境中跳过签名配置检查，因为签名将由 GitHub Actions 处理
                storeFile = null
                storePassword = null
                keyPassword = null
                keyAlias = null
            }
        }
    }

    defaultConfig {
        def getGitHash = providers.exec {
            commandLine 'git', 'rev-parse', '--short=9', 'HEAD'
        }.standardOutput.asText.get().trim()
        applicationId 'co.candyhouse.sesame2'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 266
        versionName '3.0.266'
        buildConfigField("String", "GIT_HASH", "\"${getGitHash}\"")
        // AWS Cognito 配置
        buildConfigField("String", "AWS_IDENTITY_POOL_ID", "\"${rootProject.ext['aws.cognito.identityPoolId']}\"")
        buildConfigField("String", "AWS_USER_POOL_ID", "\"${rootProject.ext['aws.cognito.userPoolId']}\"")
        buildConfigField("String", "AWS_APP_CLIENT_ID", "\"${rootProject.ext['aws.cognito.appClientId']}\"")

        // Google Maps API Key
        manifestPlaceholders = [
                GOOGLE_MAPS_API_KEY: rootProject.ext['google.maps.apiKey']
        ]
    }

    buildTypes {
        debug {
            applicationIdSuffix '.phase2debug'
            versionNameSuffix '-phase2-debug'
            signingConfig signingConfigs.phase3Debug
            minifyEnabled false
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
                nativeSymbolUploadEnabled = false
            }
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                println("Local signing...")
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }

        ci {
            initWith release
            matchingFallbacks = ['release']
        }

    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/DEPENDENCIES'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
}

androidComponents {
    onVariants(selector().withBuildType("ci")) { variant ->
        if (System.getenv("CI") == "true") {
            def versionCode = System.getenv("VERSION_CODE")
            if (versionCode != null) {
                variant.outputs.forEach { output ->
                    output.versionCode.set(Integer.parseInt(versionCode))
                    println "Set CI version: ${versionCode}"
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "processDebugGoogleServices") {
        task.enabled = false
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(':sesame-sdk')

    implementation libs.androidx.work.runtime
    implementation libs.androidx.core.ktx.v180
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.swiperefreshlayout

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.compose.ui.viewbinding
    debugImplementation libs.androidx.ui.tooling

    implementation libs.core
    implementation libs.easypermissions
    implementation libs.material
    implementation libs.dfu
    implementation libs.wheelpicker
    implementation libs.indicatorseekbar
    implementation libs.loopview
    implementation libs.glide

    implementation libs.play.services.location
    implementation libs.play.services.maps
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.config.ktx
    implementation libs.firebase.analytics.ktx
    implementation libs.firebase.messaging.ktx
    implementation libs.firebase.crashlytics.ktx

    testImplementation 'junit:junit:4.13.2'
}
